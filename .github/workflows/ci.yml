name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  check:
    name: Format and clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: rustfmt
        run: cargo fmt --all --check
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: Unit and integration tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: cargo test
        run: cargo test --workspace

  tts-live:
    name: TTS live test (installs both voices)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Cache TTS voice models
        uses: actions/cache@v4
        with:
          path: ~/.local/share/qinari/models
          key: qinari-voices-${{ runner.os }}-v2
      - name: Build the CLI
        run: cargo build --release --bin qinari
      - name: Install voices (curl download, SHA-256 verified)
        run: ./target/release/qinari setup --yes --accept-license
      - name: Run network-dependent tests
        run: cargo test --workspace -- --ignored

  deny:
    name: Licenses and advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-deny
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - run: cargo deny check licenses advisories bans

  build:
    name: Release build and smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build release binary
        run: cargo build --release --bin qinari
      - name: Bench targets compile
        run: cargo bench --workspace --no-run
      - name: Smoke test
        run: |
          ./target/release/qinari --version
          ./target/release/qinari sfx ui_success --duration 300ms --seed 1 --out /tmp/smoke.wav
          ./target/release/qinari analyze /tmp/smoke.wav
