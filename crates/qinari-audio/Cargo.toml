symphonia = { version = "0.6.1", default-features = false, features = [
    "wav",
    "mp3",
    "pcm",
] }
thiserror = { workspace = true }

[dev-dependencies]
criterion = { workspace = true }

[[bench]]
name = "audio"
harness = false
