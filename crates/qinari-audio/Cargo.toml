[package]
name = "qinari-audio"
description = "Qinari audio crate"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
qinari-dsp = { version = "0.0.5-alpha", path = "../qinari-dsp" }
