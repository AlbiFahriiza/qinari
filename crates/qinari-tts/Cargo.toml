[package]
name = "qinari-tts"
description = "Qinari tts crate"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
qinari-dsp = { version = "0.1.5", path = "../qinari-dsp" }
qinari-audio = { version = "0.1.5", path = "../qinari-audio" }
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
# Blocking HTTP with rustls; the `json` feature only adds `send_json`, it pulls
# no TLS stack of its own (native-tls is never enabled).
ureq = { version = "3.5.1", features = ["json"] }
hound = "3.5.1"
# Exact pin: ONNX Runtime binary API is coupled to the rc series.
ort = { version = "=2.0.0-rc.15" }
# Bundle digest verification (same pinned version the CLI downloader uses).
sha2 = { workspace = true }
