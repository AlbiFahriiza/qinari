# cargo-deny configuration for the GPL-3.0-or-later Qinari workspace.
# Non-Rust components and their licenses are documented in
# docs/NON-RUST-DEPENDENCIES.md.

[graph]
all-features = true

[licenses]
version = 2
allow = [
    "GPL-3.0-or-later",
    "GPL-3.0-only",
    "LGPL-3.0-only",
    "LGPL-3.0-or-later",
    # "LGPL-3.0" is the deprecated SPDX alias of LGPL-3.0-only; the
    # mp3lame-encoder/mp3lame-sys crates still declare it verbatim.
    "LGPL-3.0",
    "LGPL-2.1-only",
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MPL-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "CDLA-Permissive-2.0",
    "CC0-1.0",
]
confidence-threshold = 0.93

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"

[advisories]
version = 2
yanked = "deny"
